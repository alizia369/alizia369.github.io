name: Import legacy WordPress assets
# Copies images and PDFs from the old WordPress site into assets/legacy/.
# Runs whenever tools/legacy-assets.txt changes on main.
on:
  push:
    branches: [main]
    paths: [tools/legacy-assets.txt]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          mkdir -p assets/legacy
          log=assets/legacy/import-log.txt; : > "$log"
          grep -v '^#' tools/legacy-assets.txt | grep -v '^$' | while read -r url; do
            name=$(basename "$url")
            code=$(curl -sSL --max-time 180 -A "Mozilla/5.0 (X11; Linux x86_64)" -o "assets/legacy/$name" -w '%{http_code}' "$url" 2>>"$log" || echo "ERR")
            size=$(stat -c%s "assets/legacy/$name" 2>/dev/null || echo 0)
            echo "$code $size $name" >> "$log"
            if [ "$code" != "200" ]; then rm -f "assets/legacy/$name"; fi
          done
          find assets/legacy -size +95M -print -delete >> "$log"
          cat "$log"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/legacy
          git diff --cached --quiet && echo "nothing new" || (git commit -m "Import legacy assets from ali-zia.me" && git push)
